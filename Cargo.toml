[workspace]
resolver = "2"
members = [
    "crates/deck-core",
    "crates/deck-engines",
    "crates/deck-feeds",
    "crates/deck-agents",
    "crates/deck-cli",
    "crates/deck-tauri",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
deck-core = { path = "crates/deck-core" }
deck-engines = { path = "crates/deck-engines" }
deck-feeds = { path = "crates/deck-feeds" }
deck-agents = { path = "crates/deck-agents" }
deck-tauri = { path = "crates/deck-tauri" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
anyhow = "1"

[profile.release]
lto = "thin"

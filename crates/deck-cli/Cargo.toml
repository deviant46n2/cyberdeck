[package]
name = "deck-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "deck"
path = "src/main.rs"

[dependencies]
deck-core = { workspace = true }
deck-engines = { workspace = true }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
